<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DripCheck AI — Yasal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0D0D0D;
      color: #F5F5F5;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { max-width: 540px; padding: 48px 24px; text-align: center; }
    h1 { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 8px; }
    p { color: #8A8A8A; font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a {
      display: block;
      padding: 18px 24px;
      background: #1A1A1A;
      border-radius: 14px;
      color: #E8D5B0;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      transition: background 0.15s;
    }
    a:hover { background: #242424; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #E8D5B0; display: inline-block; margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="dot"></div>
    <h1>DripCheck AI</h1>
    <p>Yasal belgelerimize aşağıdan ulaşabilirsiniz.</p>
    <div class="links">
      <a href="privacy-policy.html">Gizlilik Politikası</a>
      <a href="terms.html">Kullanım Koşulları</a>
    </div>
  </div>
</body>
</html>
